[workspace]
members = [".", "tools/testlib", "crates/themes"]
resolver = "3"

[package]
name = "musinator"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "A modern-looking terminal music player for Linux"
repository = "https://github.com/smanookian/musinator"
rust-version = "1.88"

[dependencies]
musinator-themes = { path = "crates/themes" }
anyhow = "1"
bitflags = "2"
crossbeam-channel = "0.5"
crossterm = "0.29"
directories = "6"
ebur128 = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
libc = "0.2"
lofty = "0.25"
mpris-server = "0.10"
notify = "8"
opus = "0.3"
parking_lot = "0.12"
pipewire = { version = "0.10", features = ["v0_3_49"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
rayon = "1"
rtrb = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
toml = "1"
unicode-width = "0.2"
walkdir = "2"
ureq = "3"
ab_glyph = "0.2"
zbus = "5"
async-io = "2"
futures-lite = "2"
async-channel = "2"
md5 = "0.8.1"
roxmltree = "0.21.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
