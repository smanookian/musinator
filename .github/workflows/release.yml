name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libpipewire-0.3-dev libopus-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --locked -p musinator
      - name: Package
        run: |
          mkdir dist
          cp target/release/musinator packaging/musinator.desktop packaging/musinator.svg LICENSE README.md dist/
          tar -czf musinator-x86_64-linux.tar.gz -C dist .
          sha256sum musinator-x86_64-linux.tar.gz > musinator-x86_64-linux.tar.gz.sha256
      - name: Release notes
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" musinator-x86_64-linux.tar.gz musinator-x86_64-linux.tar.gz.sha256 \
            --title "Musinator $GITHUB_REF_NAME" --notes-file notes.md || \
          gh release upload "$GITHUB_REF_NAME" musinator-x86_64-linux.tar.gz musinator-x86_64-linux.tar.gz.sha256 --clobber
