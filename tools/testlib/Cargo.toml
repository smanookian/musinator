[package]
name = "testlib"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates a deterministic test music library for Musinator"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
